# ============================================================
# LoRA Training Configuration - Mac MPS (M4 Max)
# ============================================================
# 針對 Apple Silicon MPS 優化的配置

# === Paths ===
model_path: "D:/Real-ESRGAN/experiments/pretrained_models/RealESRGAN_x4plus.pth"
pairs_csv: "D:/degraded_full_dataset/pairs.csv"

# === LoRA Architecture ===
rank: 32  # 更大容量學習複雜去模糊
alpha: 1.0

# === Training Hyperparameters (MPS 優化) ===
lr: 5e-5  # 較低學習率，避免過度平滑

# Mac MPS 優化設置（記憶體較保守）
batch_size: 2  # MPS 記憶體管理不如 CUDA，用較小 batch
epochs: 80
patch_size: 256  # MPS 用較小的 patch（256 是平衡點）
scale: 4

# === Learning Rate Scheduler ===
use_scheduler: true
lr_milestones: [40, 60]
lr_gamma: 0.5

# === Loss Functions ===
use_perceptual_loss: true  # 關鍵！保持銳度
perceptual_weight: 0.2

# === Performance (MPS) ===
amp: false  # ❌ MPS 不支援 AMP

# === Checkpointing ===
# 跨平台共用 checkpoint（可在 Windows/Mac 間互相 resume）
checkpoint: "./lora_checkpoint_r32.pth"
epoched_checkpoints: true
save_lora_only: true
keep_last: 5
save_every_n_iterations: 400   # Save checkpoint every 500 iterations (~6 hours)