# ============================================================
# LoRA Training - RTX 4060 Configuration (8GB VRAM)
# ============================================================
# 針對 NVIDIA RTX 4060 優化的配置（改進版）

# === Paths ===
model_path: "P:/Real-ESRGAN/experiments/pretrained_models/RealESRGAN_x4plus.pth"
pairs_csv: "P:/degraded_full_dataset/pairs.csv"

# === LoRA Architecture ===
rank: 32              # 更大容量，學習複雜去模糊
alpha: 1.0

# === RTX 4060 OPTIMIZED ===
lr: 5e-5              # 較低學習率，避免過度平滑
batch_size: 4         # RTX 4060 8GB 可承受
epochs: 80            # 充分訓練
patch_size: 256       # LR: 256x256 → HR: 1024x1024（更大感受野）
scale: 4

# === Learning Rate Scheduler ===
use_scheduler: true
lr_milestones: [40, 60]
lr_gamma: 0.5

# === Loss Functions ===
use_perceptual_loss: true   # ✅ 關鍵！使用感知損失保持銳度
perceptual_weight: 0.2

# === Performance (CUDA) ===
amp: true             # ✅ RTX 4060 支援 AMP，加速訓練

# === Checkpointing ===
checkpoint: "./lora_checkpoint.pth"
epoched_checkpoints: true
save_lora_only: true
keep_last: 5
